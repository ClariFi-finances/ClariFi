name: CI - Goals Service

on:
  push:
    branches: [ main ]
    paths:
      - 'API.Goals/**'
      - 'API.Core/**'
      - '.github/workflows/goals.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API.Goals/**'
      - 'API.Core/**'
      - '.github/workflows/goals.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore API.Goals/API.Goals.csproj

    - name: Build
      run: dotnet build API.Goals/API.Goals.csproj -c Release --no-restore

    - name: Run Tests
      run: dotnet test API.Tests/API.Tests.csproj --filter "FullyQualifiedName~API.Tests.Features.Goal"

    - name: Build Docker Image Check
      run: docker build -f API.Goals/Dockerfile -t api-goals:${{ github.sha }} .

