name: CI - Notifications Service

on:
  push:
    branches: [ main ]
    paths:
      - 'API.Notifications/**'
      - 'API.Core/**'
      - '.github/workflows/notifications.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'API.Notifications/**'
      - 'API.Core/**'
      - '.github/workflows/notifications.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore API.Notifications/API.Notifications.csproj

    - name: Build
      run: dotnet build API.Notifications/API.Notifications.csproj -c Release --no-restore

    - name: Build Docker Image Check
      run: docker build -f API.Notifications/Dockerfile -t api-notifications:${{ github.sha }} .

